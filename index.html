<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presupuestos AG</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
:root {
  --bg:#eef2f5; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#cbd5e1;
  --teal:#0d9488; --teal-d:#0f766e; --teal-l:#ccfbf1; --zebra:#f8fafc;
  --danger:#dc2626;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
  --radius:14px;
}
*{box-sizing:border-box} html,body{margin:0;min-height:100vh}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased}

/* â”€â”€â”€ Layout â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 64px}
.grid{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}

/* â”€â”€â”€ App header â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.app-head{display:flex;flex-wrap:wrap;gap:14px;align-items:center;
  justify-content:space-between;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.head-logo{height:38px;width:auto;object-fit:contain;border-radius:6px}
.brand h1{font-size:18px;font-weight:800;margin:0;letter-spacing:-.2px}
.cat-status{font-size:12px;color:var(--muted);margin:2px 0 0;min-height:16px}

/* â”€â”€â”€ Dollar chip â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.dollar-chip{display:flex;align-items:center;gap:12px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;
  box-shadow:var(--shadow)}
.chip-label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;
  color:var(--muted);font-weight:700}
.chip-val{display:flex;align-items:baseline;gap:4px;font-size:20px;font-weight:800}
.chip-val span{color:var(--muted);font-size:14px}
.chip-val input{width:100px;font-size:20px;font-weight:800;border:none;
  border-bottom:2px solid var(--teal-l);background:transparent;color:var(--ink);
  padding:0;text-align:right;outline:none}
.chip-val input:focus{border-bottom-color:var(--teal)}
.chip-meta{font-size:11px;color:var(--muted);max-width:140px;line-height:1.3}

/* â”€â”€â”€ Cards â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow)}
.card-head{padding:12px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-head h2{margin:0;font-size:14px;font-weight:700;letter-spacing:.2px}
.card-body{padding:14px 16px}

/* â”€â”€â”€ Form elements â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;color:var(--muted)}
select,.input{width:100%;border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;font-size:14px;background:var(--card);color:var(--ink);outline:none}
select:focus,.input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-l)}

/* â”€â”€â”€ Results list â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.results{max-height:380px;overflow-y:auto;border:1px solid var(--line);
  border-radius:10px;margin-top:4px}
.results:empty{display:none}
.result-row{display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:9px 12px;border-bottom:1px solid var(--zebra);cursor:pointer;
  transition:.1s}
.result-row:last-child{border-bottom:none}
.result-row:hover{background:var(--teal-l)}
.result-row .rn{font-size:13px;font-weight:600}
.result-row .rp{font-size:12px;color:var(--muted);white-space:nowrap}
.result-row .rtag{font-size:10px;color:var(--teal-d);background:var(--teal-l);
  padding:1px 7px;border-radius:20px;margin-left:6px}
.result-empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:13px}

/* â”€â”€â”€ Buttons â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:10px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex;gap:6px;align-items:center;transition:.12s;white-space:nowrap}
.btn:hover{border-color:var(--teal);color:var(--teal-d)}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal-d);color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--danger)}
.btn-icon{padding:8px;border-radius:10px}
.btn-icon svg{width:16px;height:16px;display:block}

/* â”€â”€â”€ Tools bar (right card header) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toggle{display:inline-flex;align-items:center;gap:5px;font-size:12px;
  color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--teal);width:14px;height:14px}

/* â”€â”€â”€ Presupuesto exportable (#capture) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
#capture{padding:0}
.q-header{display:flex;align-items:center;justify-content:space-between;
  padding-bottom:10px;border-bottom:2px solid var(--teal-d);margin-bottom:10px}
.q-logo{height:32px;width:auto;object-fit:contain}
.q-title-block{text-align:right}
.q-brand{display:block;font-size:16px;font-weight:800;color:var(--teal-d)}
.q-date{display:block;font-size:12px;color:var(--muted)}
.q-subtitle{font-size:13px;color:var(--muted);margin-bottom:10px;min-height:18px;
  border:1px dashed transparent;border-radius:6px;padding:2px 4px;outline:none}
.q-subtitle:empty::before{content:attr(data-placeholder);color:var(--line)}
.q-subtitle:focus{border-color:var(--line)}

/* â”€â”€â”€ Quote table â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
table.qtable{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;
  overflow:hidden;border-radius:10px;box-shadow:0 1px 0 var(--line);margin-bottom:8px}
table.qtable thead th{background:var(--teal-d);color:#fff;font-weight:700;
  font-size:12px;padding:10px 14px;text-align:left;text-transform:uppercase;letter-spacing:.4px}
table.qtable thead th.num{text-align:right}
table.qtable tbody td{padding:10px 14px;border-bottom:1px solid #e2e8f0;background:#fff}
table.qtable tbody tr:nth-child(even) td{background:var(--zebra)}
table.qtable tbody tr:last-child td{border-bottom:none}
table.qtable td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.qtable td.pesos{font-weight:800;color:var(--teal-d)}
table.qtable td.name{font-weight:600}
table.qtable td.name[contenteditable]:focus{outline:2px solid var(--teal-l);border-radius:4px}
table.qtable tfoot td{padding:10px 14px;background:var(--zebra);font-weight:800}
table.qtable tfoot td.total-label{color:var(--muted);font-size:12px;
  text-transform:uppercase;letter-spacing:.4px}
table.qtable tfoot td.total-val{text-align:right;font-size:16px;color:var(--teal-d)}
.del{border:none;background:transparent;color:var(--muted);cursor:pointer;
  font-size:15px;padding:2px 4px;border-radius:6px;line-height:1}
.del:hover{color:var(--danger);background:#fee2e2}
.q-empty{padding:48px 16px;text-align:center;color:var(--muted)}
.q-empty svg{width:36px;height:36px;opacity:.35;margin-bottom:8px;display:block;margin-left:auto;margin-right:auto}

/* â”€â”€â”€ Leyenda â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.leyenda{font-size:11px;color:var(--muted);padding:6px 2px;border-top:1px solid var(--line);
  margin-top:6px;font-style:italic}

/* â”€â”€â”€ Export bar â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.export-bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;
  padding-top:14px;border-top:1px solid var(--line)}

/* â”€â”€â”€ Toast â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
  opacity:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;
  font-size:13px;font-weight:600;transition:.2s;pointer-events:none;z-index:80;
  box-shadow:0 10px 30px rgba(0,0,0,.3);white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger)}
</style>
</head>

<div class="wrap">

  <header class="app-head">

  <!-- â”€â”€â”€ Two-panel grid â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ -->

        </div>

  </div>
</div>

const $ = id => document.getElementById(id); // shorthand para acceder elementos del DOM por ID
let toastTimer; // referencia al timer del toast para poder cancelarlo si llega otro mensaje
function toast(msg, isErr = false) { // muestra un mensaje temporal en la esquina superior
  const el = $('toast'); // obtenemos el elemento del toast del DOM
  el.textContent = msg; // establecemos el texto del mensaje
  el.classList.toggle('err', isErr); // agregamos clase 'err' si isErr es true (rojo)
  el.classList.add('on'); // mostramos el toast agregando clase 'on'
  clearTimeout(toastTimer); // cancelamos el timer anterior si existe (evita conflictos)
  toastTimer = setTimeout(() => el.classList.remove('on'), 2400); // ocultamos después de 2.4 segundos
}

function pesosOf(item) { // convierte el precio del item a pesos según su moneda original
  return item.cur === 'A' ? Math.round(item.price) : Math.round(item.price * rate); // si es ARS devuelve entero, si USD multiplica por cotización
}
function usdCell(item) { // retorna la conversión a USD del precio, o '—' si no hay cotización
  if (item.cur === 'U') return 'USD ' + usdFmt(item.price); // si ya está en USD lo devuelve formateado
  return rate ? '≈ USD ' + usdFmt(Math.round(item.price / rate)) : '—'; // sino divide por rate o muestra '—'
}

// ─── Dólar Blue ───────────────────────────────────────────────────────────────────────────────────────────────
async function fetchRate() { // obtiene la cotización del dólar blue de la API
  const meta = $('rate-meta'); // elemento donde mostramos el estado/resultado de la consulta
  meta.textContent = 'Consultando...'; // indicador de carga mientras consultamos
  try {
    const ctrl = new AbortController(); // creamos controlador para poder cancelar la petición
    setTimeout(() => ctrl.abort(), 8000); // cancelamos si tarda más de 8 segundos
    const res = await fetch('https://dolarapi.com/v1/dolares/blue', // llamamos a dolarapi
      { cache: 'no-store', signal: ctrl.signal }); // no cacheamos, usamos abort signal
    if (!res.ok) throw new Error('HTTP ' + res.status); // si falla HTTP, lanzamos error
    const d = await res.json(); // parseamos respuesta JSON
    rate = Number(d.venta) + 10; // sumamos $10 al precio de venta (margen local)
    $('rate').value = rate; // actualizamos el input del usuario
    localStorage.setItem(RATE_KEY, rate); // guardamos en localStorage para offline
    const ts = d.fechaActualizacion // obtenemos timestamp de actualización del servidor
      ? new Date(d.fechaActualizacion) // parsea timestamp del servidor
      : new Date(); // o usamos hora actual
    meta.innerHTML = // mostramos cotización actualizada
      'Blue $' + d.venta + ' +$10<br>' +
      ts.toLocaleString('es-AR', { day:'2-digit', month:'2-digit',
        hour:'2-digit', minute:'2-digit' });
    renderQuote(); // re-renderiza los presupuestos con nueva cotización
  } catch (e) { // si falla la consulta
    const saved = localStorage.getItem(RATE_KEY); // intentamos usar valor guardado

    } else { // si no hay valor guardado
      meta.innerHTML = 'No se pudo obtener el dólar.<br>Ingresalo manualmente.'; // pedimos que lo ingrese manualmente
    }
    toast('No se pudo actualizar el dólar blue', true); // mostramos notificación de error
  }
}
